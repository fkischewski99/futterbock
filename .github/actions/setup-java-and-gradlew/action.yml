name: 'Setup Java and Checkout'
description: 'A custom action to checkout code and set up Java'
runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Change wrapper permissions
      shell: bash
      run: chmod +x ./gradlew